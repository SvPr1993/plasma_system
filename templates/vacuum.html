<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль вакуума</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .threshold-info { margin-top: 10px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>
    <h1>Проверка вакуума</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="vacuum_value">Введите значение вакуума:</label>
            <input type="text" id="vacuum_value" name="vacuum_value"
                   placeholder="Например, 0.7" value="{{ value|default:'' }}">
        </div>
        <button type="submit">Проверить</button>
    </form>

    {% if result %}
        <div class="result {{ status }}">
            <strong>{{ result }}</strong>
        </div>
    {% endif %}

    <div class="threshold-info">
        Порог: работы разрешены, если значение > {{ threshold }}
    </div>
</body>
</html>
