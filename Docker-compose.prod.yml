version: "3.9"

services:
  web:
    build: .
    command: gunicorn _settings.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DEBUG=false
    image: my-image:latest
    restart: always

